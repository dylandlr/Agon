    }[sc];
    if (!S) return { roomOp: 1, outOp: 0, sky1: '#000', sky2: '#000', sunX: 120, sunC: '#fff', sunOp: 0, farD: '', capD: '', midD: '', treeD: '', farC: '#000', capC: '#fff', midC: '#000', treeC: '#000', gC: '#000', gMarkD: '', gMarkC: '#000', tintC: 'rgba(0,0,0,0)' };
    const hs = (k, i) => { let n = Math.imul((k + 1) * 374761393 + i * 668265263, 1274126177); n = (n ^ (n >>> 13)) >>> 0; return (n % 1000) / 1000; };
    const ky = sc.length * 7 + 3, f2 = (v) => Math.round(v * 10) / 10;
    const ridge = (base, amp, shape, seed, step) => {
      let d = 'M0 170 L0 ' + f2(base);

        const r = hs(ky + seed, x / step); let y;

    return { roomOp: 0, outOp: 1, sky1: S.s1, sky2: S.s2, sunX: 112 + Math.round(hs(ky, 3) * 30), sunC: S.sun, sunOp: S.dark ? 0 : 0.85, farD: far, capD: cap, midD: mid, treeD: trees, farC: S.far, capC: '#f4f8fc', midC: S.mid, treeC: S.tree, gC: S.g, gMarkD: marks, gMarkC: S.mk, tintC: S.dark ? 'rgba(0,0,0,0.35)' : S.glow ? 'rgba(220,70,20,0.16)' : 'rgba(0,0,0,0)' };

  ex() { const p = this.props; return p.hurt && (!p.expression || p.expression === 'neutral') ? 'hurt' : (p.expression || 'neutral'); }
