<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gene helix</title>
<script src="./support.js"></script>
<script src="./art.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="{{wrap}}">
  <div style="display: flex; flex-wrap: wrap; gap: 4px 8px; font: 600 10px/14px system-ui, sans-serif">
    <sc-for list="{{legend}}" as="l" hint-placeholder-count="6"><span style="display: inline-flex; gap: 4px; align-items: center; color: #aea69a"><span style="{{l.sw}}"></span>{{l.name}}</span></sc-for>
  </div>
  <svg viewBox="{{vb}}" width="270" height="{{vh}}" role="img" aria-label="{{label}}" style="position: absolute; left: 0; top: 38px; display: block; overflow: visible">
    <sc-for list="{{seps}}" as="e" hint-placeholder-count="5"><line x1="0" y1="{{e.y}}" x2="270" y2="{{e.y}}" stroke="#624a3b" stroke-width="1" stroke-dasharray="2 3"></line></sc-for>
    <polyline points="{{refLine}}" fill="none" stroke="#624a3b" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"></polyline>
    <sc-for list="{{rungs}}" as="r" hint-placeholder-count="32"><line x1="{{r.x1}}" y1="{{r.y1}}" x2="{{r.x2}}" y2="{{r.y2}}" stroke="{{r.color}}" stroke-opacity="{{r.op}}" stroke-width="{{r.sw}}" stroke-linecap="round"></line></sc-for>
    <polyline points="{{geneLine}}" fill="none" stroke="#1c110b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"></polyline>
    <polyline points="{{geneLine}}" fill="none" stroke="#ede9e1" stroke-opacity="0.75" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    <sc-for list="{{nodes}}" as="n" hint-placeholder-count="32"><circle cx="{{n.x}}" cy="{{n.y}}" r="{{n.r}}" fill="{{n.fill}}" stroke="{{n.stroke}}" stroke-width="{{n.sw}}" opacity="{{n.op}}"></circle></sc-for>
    <sc-for list="{{marks}}" as="m" hint-placeholder-count="4"><circle cx="{{m.x}}" cy="{{m.y}}" r="{{m.r}}" fill="none" stroke="#ffd23f" stroke-width="1.6" stroke-dasharray="2 2"></circle></sc-for>
  </svg>
  <sc-for list="{{rows}}" as="w" hint-placeholder-count="32">
    <div style="{{w.rowStyle}}" onMouseEnter="{{w.enter}}" onMouseLeave="{{w.leave}}">
      <span style="{{w.nameStyle}}">{{w.name}}</span>
      <span style="{{w.valStyle}}">{{w.val}}</span>
    </div>
  </sc-for>
  <div style="{{ctrlStyle}}"><span style="font: 11px/16px system-ui, sans-serif; color: #aea69a">Rotate</span><input type="range" min="0" max="6.28" step="0.05" value="{{rot}}" onInput="{{setRot}}" aria-label="Rotate helix" style="flex: 1; accent-color: #ffd23f"></div>
  <div style="{{noteStyle}}"><div style="font-weight: 700; color: #ede9e1">{{noteHead}}</div><div>{{note}}</div><sc-for list="{{lines}}" as="q" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid #624a3b; padding: 1px 0"><span>{{q.k}}</span><span style="{{q.vs}}">{{q.v}}</span></div></sc-for><sc-for list="{{mods}}" as="d" hint-placeholder-count="1"><div style="color: #ffd23f; margin-top: 2px">{{d.t}}</div></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vals":{"editor":"string","default":""},"traits":{"editor":"string","default":""},"muts":{"editor":"string","default":""},"phys":{"editor":"string","default":""},"$preview":{"width":270,"height":560}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { hi: -1, rot: 0.6 }; }
  renderVals() {
    const A = window.AgonArt, p = this.props, s = this.state, G = A.GENES, NG = G.length;
    const raw = String(p.vals || '').split(',').map(Number);
    const MU = A.mutationLines(String(p.muts || '').split(',')), tk = String(p.traits || '').split(',').filter(Boolean), TR = tk.map((k) => A.TRAITS.find((t) => t.key === k)).filter(Boolean);
    const items = G.map((ge, i) => ({ key: ge.key, idx: i, label: ge.label, group: ge.group, on: ge.on, v: Number.isFinite(raw[i]) ? raw[i] : 1, temp: false, drives: ge.drives,
      mods: (ge.fx ? TR.filter((t) => t.fx && t.fx[ge.fx] !== undefined) : []).concat(MU.filter((m) => m.fx[ge.key] !== undefined).map((m) => ({ label: m.label, desc: 'x' + m.fx[ge.key].toFixed(2) + ' on this gene. ' + m.text, mut: true }))) }))
      .concat(A.PERS.map((n, t) => ({ key: 'p' + t, idx: t, label: n, group: 'Temperament', on: 1, v: Number.isFinite(raw[NG + t]) ? raw[NG + t] : 0.5, temp: true, drives: 'Behaviour choices', mods: TR.filter((x) => x.pers && x.pers[0] === t) })));
    const N = items.length, cx = 135, R0 = 7, RM = 50, dy = 13.4, y0 = 10, vh = Math.round(y0 + N * dy + 6);
    const u = (it) => it.temp ? Math.max(0.04, Math.min(1, it.v)) : Math.max(0.04, Math.min(1, (Math.log2(Math.max(0.01, it.v)) + 2) / 4));
    const rB = R0 + RM * 0.5, f = (n) => n.toFixed(1), hi = s.hi;
    const pts = items.map((it, i) => { const th = s.rot + i * 0.5, rA = R0 + RM * u(it); return { dep: Math.sin(th), ax: cx + rA * Math.cos(th), bx: cx + rB * Math.cos(th + Math.PI), y: y0 + i * dy + 2 * Math.sin(th), by: y0 + i * dy + 2 * Math.sin(th + Math.PI) }; });
    const col = (it) => A.GENE_GROUPS[it.group];
    const geneLine = pts.map((q) => f(q.ax) + ',' + f(q.y)).join(' '), refLine = pts.map((q) => f(q.bx) + ',' + f(q.by)).join(' ');
    const above = (it) => it.temp ? it.v >= 0.5 : it.v >= 1;
    const rungs = pts.map((q, i) => ({ x1: f(q.ax), y1: f(q.y), x2: f(q.bx), y2: f(q.by), color: i === hi ? '#ffd23f' : (above(items[i]) ? col(items[i]) : '#e0504a'), op: i === hi ? 1 : 0.5, sw: i === hi ? 3 : 1.6 }));
    const order = pts.map((q, i) => i).sort((a, b) => pts[a].dep - pts[b].dep);
    const nodes = order.map((i) => { const q = pts[i], it = items[i]; return { x: f(q.ax), y: f(q.y), r: f((i === hi ? 5 : 3.2) + q.dep), fill: it.on ? col(it) : '#30231b', stroke: i === hi ? '#ffd23f' : it.on ? '#1c110b' : col(it), sw: it.on ? 1.5 : 1.8, op: q.dep < -0.3 ? 0.6 : 1 }; });
    const marks = items.map((it, i) => it.mods.length ? { x: f(pts[i].ax), y: f(pts[i].y), r: 6.5 + pts[i].dep } : null).filter(Boolean);
    const seps = items.map((it, i) => i > 0 && items[i - 1].group !== it.group ? { y: f(y0 + i * dy - dy / 2) } : null).filter(Boolean);
    const rows = items.map((it, i) => {
      const on = i === hi, top = 38 + y0 + i * dy - 7;
      return { name: (it.mods.length ? (it.mods.some((t) => t.mut) ? '✦ ' : '◆ ') : '') + it.label, val: it.temp ? Math.round(it.v * 100) + '%' : 'x' + it.v.toFixed(2), enter: () => this.setState({ hi: i }), leave: () => { if (this.state.hi === i) this.setState({ hi: -1 }); },
        rowStyle: 'position: absolute; left: 0; width: 270px; top: ' + f(top) + 'px; height: 13px; display: flex; justify-content: space-between; align-items: center; cursor: default',
        nameStyle: 'width: 84px; font: ' + (on ? 700 : 600) + ' 10px/13px system-ui, sans-serif; color: ' + (on ? '#ffd23f' : col(it)) + '; white-space: nowrap; background: rgba(48,35,27,0.7); border-radius: 3px; padding: 0 2px',
        valStyle: 'width: 40px; text-align: right; font: 10px/13px ui-monospace, Menlo, Consolas, monospace; color: ' + (on ? '#ffd23f' : above(it) ? '#ede9e1' : '#e08a78') + '; background: rgba(48,35,27,0.7); border-radius: 3px; padding: 0 2px' };
    });
    const h = hi >= 0 ? items[hi] : null;
    const legend = Object.keys(A.GENE_GROUPS).map((k) => ({ name: k, sw: 'width: 8px; height: 8px; border-radius: 50%; background: ' + A.GENE_GROUPS[k] }));
    return { vb: '0 0 270 ' + vh, vh, wrap: 'position: relative; width: 270px; height: ' + (38 + vh + 200) + 'px', rungs, nodes, marks, seps, geneLine, refLine, rows, legend, rot: s.rot, setRot: (e) => this.setState({ rot: Number(e.target.value) }),
      ctrlStyle: 'position: absolute; left: 0; top: ' + (38 + vh + 4) + 'px; width: 270px; display: flex; gap: 8px; align-items: center',
      noteStyle: 'position: absolute; left: 0; top: ' + (38 + vh + 28) + 'px; width: 270px; font: 11px/15px system-ui, sans-serif; color: #aea69a',
      noteHead: h ? h.label + ' · ' + h.group + ' · ' + (h.temp ? Math.round(h.v * 100) + '%' : 'x' + h.v.toFixed(2)) + (h.on ? '' : ' · latent') : (p.phys || 'Physical stats'),
      note: h ? (h.on ? 'Active in the sim. ' : 'Latent: no system reads it yet. ') + (h.drives || '') + '.' : 'Distance from the axis is the value; dashed strand is the average. Filled dots change the sim, hollow dots are latent. Dashed gold rings and the diamond mark values a trait is modifying.',
      lines: h ? A.geneDetail(h).lines.map((q) => ({ k: q[0], v: q[1], vs: 'font-family: ui-monospace, Menlo, Consolas, monospace; color: ' + (/^-/.test(q[1]) ? '#e08a78' : /^\+/.test(q[1]) ? '#7fbf8e' : '#ede9e1') })) : [],
      mods: h ? h.mods.map((t) => ({ t: (t.mut ? 'Mutation ' : 'Trait ') + t.label + ': ' + t.desc })) : [],
      label: 'Gene helix: ' + items.map((it) => it.label + ' ' + it.v.toFixed(2)).join(', ') };
  }
}
</script>
</body>
</html>
