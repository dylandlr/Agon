<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animal</title>
<script src="./support.js"></script>
<script src="./art.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<svg viewBox="0 0 64 64" width="{{size}}" height="{{size}}" role="img" aria-label="{{label}}" style="display: block; overflow: visible">
  <g transform="{{tf}}">
  <!-- hard-edged contact shadow -->
  <ellipse cx="{{shX}}" cy="{{shY}}" rx="{{shRxO}}" ry="{{shRyO}}" fill="#000000" opacity="{{shOpO}}"></ellipse>
  <ellipse cx="{{shX}}" cy="{{shY}}" rx="{{shRx}}" ry="{{shRy}}" fill="#000000" opacity="{{shOp}}"></ellipse>

  <sc-for list="{{headBack}}" as="h" hint-placeholder-count="0"><path d="{{h.d}}" fill="{{h.f}}" stroke="{{h.s}}" stroke-width="{{h.w}}" stroke-linejoin="round" stroke-linecap="round" transform="{{h.t}}"></path></sc-for>
  <sc-for list="{{bodyList}}" as="h" hint-placeholder-count="0"><path d="{{h.d}}" fill="{{h.f}}" stroke="{{h.s}}" stroke-width="{{h.w}}" stroke-linejoin="round" stroke-linecap="round"></path></sc-for>
  <sc-if value="{{sideBody}}" hint-placeholder-val="{{ true }}">
  <g transform="{{lkTf}}">
  <!-- SMALL PREY: side profile, tall ears, round haunch -->
  <sc-if value="{{small}}" hint-placeholder-val="{{ true }}">
    <ellipse cx="36.6" cy="20" rx="3" ry="9" transform="rotate(-15 36.6 20)" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <ellipse cx="36.6" cy="20.5" rx="1" ry="5.2" transform="rotate(-15 36.6 20)" fill="{{earC}}" opacity="0.55"></ellipse>
    <ellipse cx="46" cy="19" rx="3.2" ry="9.4" transform="rotate(9 46 19)" fill="{{body}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <ellipse cx="46" cy="19.6" rx="1.2" ry="5.7" transform="rotate(9 46 19)" fill="{{earC}}"></ellipse>
    <ellipse cx="38" cy="53" rx="5.5" ry="2.8" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <ellipse cx="19" cy="53" rx="7" ry="2.8" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <circle cx="11" cy="41" r="4.6" fill="{{belly}}" stroke="#1c110b" stroke-width="2"></circle>
    <ellipse cx="28" cy="41" rx="15" ry="11.5" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <ellipse cx="27" cy="38.5" rx="12.5" ry="8.5" fill="{{body}}"></ellipse>
    <path d="M38.75 41.4 A12.5 8.5 0 0 1 15.25 41.4 Q27 42.4 38.75 41.4Z" fill="{{belly}}"></path>
    <circle cx="20" cy="43" r="8" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></circle>
    <circle cx="19" cy="42" r="6" fill="{{body}}"></circle>
    <circle cx="44" cy="33" r="8.4" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></circle>
    <circle cx="43" cy="32" r="6.6" fill="{{body}}"></circle>
    <circle cx="51.6" cy="35" r="2" fill="#e0a090" stroke="#1c110b" stroke-width="1.4"></circle>
  </sc-if>

  <!-- LARGE PREY: bristleback boar. Barrel body, bristle ridge, snout and tusk -->
  <sc-if value="{{large}}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{legs}}" as="g" hint-placeholder-count="4"><g style="{{g.anim}}"><path d="{{g.p}}" fill="{{g.fill}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path><path d="{{g.hd}}" fill="none" stroke="{{g.hoof}}" stroke-width="{{g.wf}}" stroke-linecap="butt"></path></g></sc-for>
    <path d="M9 36 q-6 -1 -5 -7" fill="none" stroke="#1c110b" stroke-width="4" stroke-linecap="round"></path>
    <path d="M9 36 q-6 -1 -5 -7" fill="none" stroke="{{markC}}" stroke-width="1.6" stroke-linecap="round"></path>
    <path d="{{tor.o}}" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path>
    <path d="{{tor.i}}" fill="{{body}}"></path>
    <path d="{{tor.b}}" fill="{{belly}}"></path>
    <path d="{{tor.t}}" fill="none" stroke="{{bodyS}}" stroke-width="1.3" stroke-linecap="round"></path>
    <sc-for list="{{bristles}}" as="b" hint-placeholder-count="7"><polygon points="{{b.pts}}" fill="{{markC}}" stroke="#1c110b" stroke-width="1.6" stroke-linejoin="round"></polygon></sc-for>
    <sc-if value="{{boar}}"><polygon points="45,35 48,26 54,34" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></polygon></sc-if>
    <sc-if value="{{ele}}">
      <path d="M46 31 Q33 25 35 41 Q37 52 47 46Z" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path>
      <path d="M45 34 Q38 31 39 41 Q40 47 45 44Z" fill="{{belly}}" opacity="0.55"></path>
    </sc-if>
    <ellipse cx="51" cy="41" rx="{{hdRx}}" ry="{{hdRy}}" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <ellipse cx="50" cy="40" rx="{{hdRx2}}" ry="{{hdRy2}}" fill="{{body}}"></ellipse>
    <sc-if value="{{boar}}">
      <ellipse cx="59" cy="45" rx="4.6" ry="3.8" fill="#d9a090" stroke="#1c110b" stroke-width="2"></ellipse>
      <circle cx="60.6" cy="44.4" r="0.9" fill="#1c110b"></circle>
      <path d="M57 47.4 q3.4 1.2 3.6 -3.6" fill="none" stroke="#1c110b" stroke-width="5.4" stroke-linecap="round"></path>
      <path d="M57 47.4 q3.4 1.2 3.6 -3.6" fill="none" stroke="#e8dcc4" stroke-width="2.6" stroke-linecap="round"></path>
    </sc-if>
    <sc-if value="{{ele}}">
      <path d="M57 42 Q64 45 62.5 54 Q62 58 58.8 57" fill="none" stroke="#1c110b" stroke-width="7.6" stroke-linecap="round"></path>
      <path d="M57 42 Q64 45 62.5 54 Q62 58 58.8 57" fill="none" stroke="{{body}}" stroke-width="5.2" stroke-linecap="round"></path>
      <path d="M57 42 Q63 45 61.6 52" fill="none" stroke="{{belly}}" stroke-width="1.4" stroke-linecap="round" opacity="0.6"></path>
      <path d="M54.5 47 Q61 50 63.5 43.5" fill="none" stroke="#1c110b" stroke-width="4.6" stroke-linecap="round"></path>
      <path d="M54.5 47 Q61 50 63.5 43.5" fill="none" stroke="#efe6d0" stroke-width="2.4" stroke-linecap="round"></path>
    </sc-if>
    <sc-if value="{{wil}}">
      <path d="M47 33 Q43 26 49 24.5 Q46 28 49.5 33" fill="#d9d0b8" stroke="#1c110b" stroke-width="1.6" stroke-linejoin="round"></path>
      <ellipse cx="59" cy="45" rx="4.4" ry="3.6" fill="{{markC}}" stroke="#1c110b" stroke-width="2"></ellipse>
      <circle cx="60.4" cy="44.2" r="0.9" fill="#0c0806"></circle>
      <path d="M56 48.5 L54.6 57 L59.4 50Z" fill="{{markC}}" stroke="#1c110b" stroke-width="1.5" stroke-linejoin="round"></path>
    </sc-if>
  </sc-if>

  <!-- PREDATOR: lean wolf. Low body, bushy tail, ruff, pricked ears, yellow eye -->
  <sc-if value="{{pred}}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{legs}}" as="g" hint-placeholder-count="4"><g style="{{g.anim}}"><path d="{{g.p}}" fill="{{g.fill}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path><path d="{{g.hd}}" fill="none" stroke="{{g.hoof}}" stroke-width="{{g.wf}}" stroke-linecap="butt"></path></g></sc-for>
    <path d="M11 37 Q3 38 3 48" fill="none" stroke="#1c110b" stroke-width="9" stroke-linecap="round"></path>
    <path d="M11 37 Q3 38 3 48" fill="none" stroke="{{body}}" stroke-width="5.4" stroke-linecap="round"></path>
    <path d="M3.2 45 L3 48" fill="none" stroke="{{belly}}" stroke-width="5.4" stroke-linecap="round"></path>
    <path d="{{tor.o}}" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path>
    <path d="{{tor.i}}" fill="{{body}}"></path>
    <path d="{{tor.b}}" fill="{{belly}}"></path>
    <path d="{{tor.t}}" fill="none" stroke="{{bodyS}}" stroke-width="1.3" stroke-linecap="round"></path>
    <sc-for list="{{spotList}}" as="s" hint-placeholder-count="0"><ellipse cx="{{s.x}}" cy="{{s.y}}" rx="{{s.rx}}" ry="{{s.ry}}" fill="{{spotC}}" opacity="0.9"></ellipse></sc-for>
    <sc-if value="{{cat}}" hint-placeholder-val="{{ false }}">
      <path d="M11 36 Q1 35 1.6 44 Q2 50.6 8.6 49.6" fill="none" stroke="#1c110b" stroke-width="9" stroke-linecap="round"></path>
      <path d="M11 36 Q1 35 1.6 44 Q2 50.6 8.6 49.6" fill="none" stroke="{{body}}" stroke-width="5.4" stroke-linecap="round"></path>
      <path d="M2.4 47 Q3.6 50.4 8.6 49.6" fill="none" stroke="{{markC}}" stroke-width="5.4" stroke-linecap="round"></path>
    </sc-if>
    <path d="M36.5 33 Q47 31.5 46.5 38 Q45.5 45 39 45.5 Q34 41 36.5 33Z" fill="{{belly}}" stroke="#1c110b" stroke-width="1.6" stroke-linejoin="round"></path>
    <polygon points="48,27 52,18 57,28" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></polygon>
    <polygon points="42,28 45,17 51,27" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></polygon>
    <polygon points="44.4,26 45.4,20.4 48.8,26" fill="{{markC}}"></polygon>
    <ellipse cx="49" cy="32" rx="8.5" ry="7" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <ellipse cx="48" cy="31" rx="6.8" ry="5.4" fill="{{body}}"></ellipse>
    <ellipse cx="{{snCx}}" cy="35" rx="{{snRx}}" ry="3.6" fill="{{belly}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <circle cx="{{noseX}}" cy="34.2" r="1.8" fill="#1c110b"></circle>
    <path d="M54.5 37.4 q2.2 1.2 4.6 0" fill="none" stroke="#1c110b" stroke-width="1.2" stroke-linecap="round"></path>
  </sc-if>


  <!-- DEER: large prey, tall legs, antlers -->
  <sc-if value="{{deer}}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{legs}}" as="g" hint-placeholder-count="4"><g style="{{g.anim}}"><path d="{{g.p}}" fill="{{g.fill}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path><path d="{{g.hd}}" fill="none" stroke="{{g.hoof}}" stroke-width="{{g.wf}}" stroke-linecap="butt"></path></g></sc-for>
    <path d="{{tor.o}}" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path>
    <path d="{{tor.i}}" fill="{{body}}"></path>
    <path d="{{tor.b}}" fill="{{belly}}"></path>
    <path d="{{tor.t}}" fill="none" stroke="{{bodyS}}" stroke-width="1.3" stroke-linecap="round"></path>
    <ellipse cx="12" cy="31" rx="2.8" ry="3.6" fill="{{belly}}" stroke="#1c110b" stroke-width="1.8"></ellipse>
    <circle cx="20" cy="30" r="1.1" fill="{{belly}}"></circle><circle cx="26" cy="28" r="1.1" fill="{{belly}}"></circle><circle cx="32" cy="30" r="1.1" fill="{{belly}}"></circle><circle cx="37" cy="33" r="1.1" fill="{{belly}}"></circle>
    <ellipse cx="47" cy="11" rx="2" ry="4" fill="{{bodyS}}" stroke="#1c110b" stroke-width="1.6" transform="rotate(-30 47 11)"></ellipse>
    <ellipse cx="51" cy="17" rx="6.4" ry="4.6" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" transform="rotate(18 51 17)"></ellipse>
    <ellipse cx="50" cy="16" rx="5" ry="3.4" fill="{{body}}" transform="rotate(18 51 17)"></ellipse>
    <ellipse cx="56.5" cy="19.5" rx="3" ry="2.4" fill="{{belly}}" stroke="#1c110b" stroke-width="1.8"></ellipse>
    <circle cx="59" cy="19" r="1" fill="#1c110b"></circle>
    <path d="M49 11 L46 3 M47.4 7 L43 5.6 M49 11 L53 3.5 M51 7.2 L55.5 6" fill="none" stroke="#1c110b" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M49 11 L46 3 M47.4 7 L43 5.6 M49 11 L53 3.5 M51 7.2 L55.5 6" fill="none" stroke="{{horn}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
  </sc-if>

  <!-- MOUNTAIN GOAT: large prey, shaggy skirt, swept-back horns -->
  <sc-if value="{{goat}}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{legs}}" as="g" hint-placeholder-count="4"><g style="{{g.anim}}"><path d="{{g.p}}" fill="{{g.fill}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path><path d="{{g.hd}}" fill="none" stroke="{{g.hoof}}" stroke-width="{{g.wf}}" stroke-linecap="butt"></path></g></sc-for>
    <path d="{{tor.o}}" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path>
    <path d="{{tor.i}}" fill="{{body}}"></path>
    <path d="{{tor.b}}" fill="{{belly}}"></path>
    <path d="{{tor.t}}" fill="none" stroke="{{bodyS}}" stroke-width="1.3" stroke-linecap="round"></path>
    <polygon points="12,32 6,27 9,37" fill="{{bodyS}}" stroke="#1c110b" stroke-width="1.8" stroke-linejoin="round"></polygon>
    <path d="M16 41 Q17.4 44.4 19.6 41.8 Q22 45 24.4 42 Q27 45.2 29.4 42 Q31.8 45 34 41.8 Q36.2 44.4 38 41Z" fill="{{belly}}" stroke="{{bodyS}}" stroke-width="1.4" stroke-linejoin="round"></path>
    <ellipse cx="43" cy="23" rx="3.6" ry="1.6" fill="{{bodyS}}" stroke="#1c110b" stroke-width="1.6" transform="rotate(20 43 23)"></ellipse>
    <ellipse cx="48" cy="27" rx="6" ry="4.8" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" transform="rotate(24 48 27)"></ellipse>
    <ellipse cx="47" cy="26" rx="4.6" ry="3.4" fill="{{body}}" transform="rotate(24 48 27)"></ellipse>
    <ellipse cx="53.6" cy="30.4" rx="3.2" ry="2.5" fill="{{belly}}" stroke="#1c110b" stroke-width="1.8"></ellipse>
    <circle cx="56" cy="30" r="0.9" fill="#1c110b"></circle>
    <polygon points="50,33 52.8,33 51.2,39" fill="{{belly}}" stroke="#1c110b" stroke-width="1.4" stroke-linejoin="round"></polygon>
    <path d="M45 22 Q43 13 35 11" fill="none" stroke="#1c110b" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M45 22 Q43 13 35 11" fill="none" stroke="{{horn}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M47.6 21.6 Q47.4 14 41.4 10" fill="none" stroke="#1c110b" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M47.6 21.6 Q47.4 14 41.4 10" fill="none" stroke="{{horn}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
  </sc-if>

  <!-- GROUSE: small prey, ground bird -->
  <sc-if value="{{grouse}}" hint-placeholder-val="{{ false }}">
    <polygon points="16,36 3,26 3.5,34 2,40 3.5,46 16,44" fill="{{markC}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></polygon>
    <path d="M14 38 L5 31 M14 41 L4 40 M14 43 L5 45" fill="none" stroke="{{belly}}" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M27 49 L27 56 M27 56 l-3 1 M27 56 l3 1" fill="none" stroke="#1c110b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M27 49 L27 56 M27 56 l-3 1 M27 56 l3 1" fill="none" stroke="#c9a878" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M34 49 L34 56 M34 56 l-3 1 M34 56 l3 1" fill="none" stroke="#1c110b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M34 49 L34 56 M34 56 l-3 1 M34 56 l3 1" fill="none" stroke="#c9a878" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
    <ellipse cx="41" cy="32" rx="5" ry="7" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <ellipse cx="28" cy="40" rx="13.5" ry="10" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <ellipse cx="27" cy="38.5" rx="11" ry="8" fill="{{body}}"></ellipse>
    <ellipse cx="36" cy="43" rx="6" ry="6" fill="{{belly}}"></ellipse>
    <ellipse cx="24" cy="39" rx="8.5" ry="5.2" fill="{{markC}}" stroke="#1c110b" stroke-width="1.6"></ellipse>
    <path d="M18 38 q4 1 8 0 M18 41 q4 1 8 0" fill="none" stroke="{{bodyS}}" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="44" cy="26" r="5.2" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></circle>
    <circle cx="43.4" cy="25.4" r="3.8" fill="{{body}}"></circle>
    <ellipse cx="45" cy="20.6" rx="2.6" ry="1.7" fill="{{comb}}" stroke="#1c110b" stroke-width="1.6"></ellipse>
    <polygon points="48.6,25 54,27 48.6,29.4" fill="#d4a43c" stroke="#1c110b" stroke-width="1.6" stroke-linejoin="round"></polygon>
    <sc-if value="{{hawk}}" hint-placeholder-val="{{ false }}">
      <path d="M17 36 Q30 30 38 38 Q30 48 18 44Z" fill="{{markC}}" stroke="#1c110b" stroke-width="1.6" stroke-linejoin="round"></path>
      <path d="M22 38 q5 -2 10 0 M22 41 q5 -2 9 0" fill="none" stroke="{{belly}}" stroke-width="1" stroke-linecap="round"></path>
      <path d="M52.6 25.6 q2.6 0.6 2 4" fill="none" stroke="#1c110b" stroke-width="2" stroke-linecap="round"></path>
      <path d="M45 24.4 l5 1.2" fill="none" stroke="#1c110b" stroke-width="1.6" stroke-linecap="round"></path>
    </sc-if>
    <sc-if value="{{owl}}" hint-placeholder-val="{{ false }}">
      <polygon points="40,21 41,15 44.4,20.4" fill="{{markC}}" stroke="#1c110b" stroke-width="1.5" stroke-linejoin="round"></polygon>
      <polygon points="45,20.6 48,15 49.4,21.4" fill="{{markC}}" stroke="#1c110b" stroke-width="1.5" stroke-linejoin="round"></polygon>
      <circle cx="45.6" cy="26" r="4.4" fill="{{belly}}" stroke="#1c110b" stroke-width="1.2"></circle>
      <polygon points="47.6,26.6 50.6,28 47.6,30" fill="#d4a43c" stroke="#1c110b" stroke-width="1.2" stroke-linejoin="round"></polygon>
    </sc-if>
    <sc-if value="{{vult}}" hint-placeholder-val="{{ false }}">
      <ellipse cx="41" cy="31.4" rx="6" ry="3.6" fill="{{belly}}" stroke="#1c110b" stroke-width="1.6"></ellipse>
      <circle cx="44" cy="25.8" r="4.2" fill="{{comb}}" stroke="#1c110b" stroke-width="1.6"></circle>
      <path d="M47.6 25 q3.4 0.6 3 4.4" fill="none" stroke="#1c110b" stroke-width="2.4" stroke-linecap="round"></path>
    </sc-if>
  </sc-if>

  <!-- FOX: small predator, white-tipped tail -->
  <sc-if value="{{fox}}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{legs}}" as="g" hint-placeholder-count="4"><g style="{{g.anim}}"><path d="{{g.p}}" fill="{{g.fill}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path><path d="{{g.hd}}" fill="none" stroke="{{g.hoof}}" stroke-width="{{g.wf}}" stroke-linecap="butt"></path></g></sc-for>
    <path d="M12 40 Q-1 36 3 50 Q9 50 14 45Z" fill="{{body}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path>
    <path d="M2 45 Q1.6 50.4 6 50.6 Q9 49.4 8.2 45.4Z" fill="#f4ecd8"></path>
    <path d="{{tor.o}}" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path>
    <path d="{{tor.i}}" fill="{{body}}"></path>
    <path d="{{tor.b}}" fill="{{belly}}"></path>
    <path d="{{tor.t}}" fill="none" stroke="{{bodyS}}" stroke-width="1.3" stroke-linecap="round"></path>
    <path d="M36.5 34 Q46.5 33 46 39 Q45 45 38.5 45 Q34.5 41 36.5 34Z" fill="{{belly}}" stroke="#1c110b" stroke-width="1.6" stroke-linejoin="round"></path>
    <polygon points="42,27 44,16 49,26" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></polygon>
    <polygon points="47,26 50,15 55,26" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></polygon>
    <polygon points="49,25 50.4,19 53,25" fill="{{markC}}" stroke="#1c110b" stroke-width="0" stroke-linejoin="round"></polygon>
    <sc-if value="{{tuft}}" hint-placeholder-val="{{ false }}">
      <path d="M44 16.4 L43.2 11 M49.6 15.4 L50.6 10" fill="none" stroke="#1c110b" stroke-width="3.2" stroke-linecap="round"></path>
      <path d="M44 16.4 L43.2 11.6 M49.6 15.4 L50.6 10.6" fill="none" stroke="{{markC}}" stroke-width="1.4" stroke-linecap="round"></path>
    </sc-if>
    <ellipse cx="49" cy="32" rx="7.2" ry="5.8" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <ellipse cx="48" cy="31" rx="5.8" ry="4.6" fill="{{body}}"></ellipse>
    <ellipse cx="56.5" cy="35" rx="5.6" ry="2.8" fill="{{belly}}" stroke="#1c110b" stroke-width="2"></ellipse>
    <circle cx="60.8" cy="34.4" r="1.5" fill="#1c110b"></circle>
  </sc-if>

  <!-- BEAR: large predator -->
  <sc-if value="{{bear}}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{legs}}" as="g" hint-placeholder-count="4"><g style="{{g.anim}}"><path d="{{g.p}}" fill="{{g.fill}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path><path d="{{g.hd}}" fill="none" stroke="{{g.hoof}}" stroke-width="{{g.wf}}" stroke-linecap="butt"></path><path d="{{g.cl}}" fill="none" stroke="#efe6d0" stroke-width="1.2" stroke-linecap="round"></path></g></sc-for>
    <circle cx="7" cy="34" r="3.2" fill="{{bodyS}}" stroke="#1c110b" stroke-width="1.8"></circle>
    <path d="{{tor.o}}" fill="{{bodyS}}" stroke="#1c110b" stroke-width="2" stroke-linejoin="round"></path>
